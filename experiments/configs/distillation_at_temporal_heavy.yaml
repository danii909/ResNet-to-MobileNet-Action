# Knowledge Distillation + Spatial & Temporal AT — temporal-heavy variant
#
# Same as distillation_at_temporal.yaml but with beta_t > beta_s.
# Rationale: temporal AT has no interpolation noise (T matches exactly),
# so it can carry a stronger signal.
#
# IMPORTANT: Matches validated slurm-train-eval-4201 settings exactly,
# adding ONLY AT-specific parameters for fair comparison.
#
# beta_s = 0.03, beta_t = 0.07 (total AT weight ~ 0.10, same budget)

seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 24
  crop_size: 112
  backend: hf
  use_eval_split: true
  eval_ratio: 0.2
  split_seed: 42

training:
  mode: distillation_at
  epochs: 60
  batch_size: 16
  num_workers: 4
  optimizer: adamw
  lr: 0.0005
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  checkpoint_dir: experiments/checkpoints

distillation:
  teacher_checkpoint: experiments/checkpoints/teacher_finetune_best.pth
  temperature: 8.0
  alpha: 0.7
  at_beta_spatial: 0.03
  at_beta_temporal: 0.07
  teacher_keys: [2, 3, 4]
  student_keys: [2, 4, 6]

logging:
  enabled: true
  project: kd-action-recognition
  run_name: kd-at-temporal-heavy
