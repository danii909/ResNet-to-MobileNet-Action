# Teacher v3 fine-tuning: 3D ResNet-50 (slow_r50) on UCF-101 with explicit train/eval split
# Usage: python -m src.training.train --config experiments/configs/teacher_24f_evalsplit.yaml

seed: 42

model:
  type: teacher
  pretrained: true
  freeze_backbone: false

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 24
  crop_size: 112
  backend: hf
  resize_short_side: 128
  use_random_resized_crop: false
  color_jitter_strength: 0.1
  random_erasing_prob: 0.05
  max_temporal_stride: 1
  use_eval_split: true
  eval_ratio: 0.2
  split_seed: 42

training:
  mode: teacher_finetune
  epochs: 50
  batch_size: 12
  num_workers: 4
  optimizer: sgd
  lr: 0.0007
  momentum: 0.9
  weight_decay: 0.001
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.1
  checkpoint_dir: experiments/checkpoints

logging:
  enabled: true
  project: kd-action-recognition
  run_name: teacher-v3-24f-evalsplit
