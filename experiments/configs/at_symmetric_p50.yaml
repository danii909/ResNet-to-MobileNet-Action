seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 24
  crop_size: 112
  backend: hf
  use_eval_split: true
  eval_ratio: 0.2
  split_seed: 42

training:
  mode: distillation_at
  epochs: 50
  batch_size: 16
  num_workers: 4
  optimizer: adamw
  lr: 0.0005
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true

distillation:
  teacher_type: teacher
  temperature: 8.0
  alpha: 0.7
  at_beta_spatial: 0.05
  at_beta_temporal: 0.05
  teacher_keys: [2, 3, 4]
  student_keys: [2, 4, 6]

logging:
  enabled: true
  project: kd-action-recognition
  run_name: at_sym_p50
