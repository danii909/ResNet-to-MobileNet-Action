# Born Again Distillation: Student -> Student -> Student
# Same architecture for teacher and student (both MobileNet3D)
# Temperature 8, Alpha 0.7, with light augmentation
# Based on distillation_t8_a07_24f_lightaug.yaml but adapted for student teacher

seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 24
  crop_size: 112
  backend: hf
  resize_short_side: 128
  use_random_resized_crop: false
  color_jitter_strength: 0.1
  random_erasing_prob: 0.05
  max_temporal_stride: 1

training:
  mode: distillation
  epochs: 60
  batch_size: 16
  num_workers: 4
  optimizer: adamw
  lr: 0.0005
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.05
  kd_warmup_epochs: 5
  checkpoint_dir: experiments/checkpoints

distillation:
  # Teacher configuration: same as student (MobileNet3D)
  teacher_type: student  # KEY CHANGE: teacher is now 'student' type, not 'teacher'
  teacher_width_mult: 1.0
  teacher_checkpoint: null  # Will be overridden by CLI
  temperature: 8.0
  alpha: 0.7

logging:
  enabled: true
  project: kd-action-recognition
  run_name: born-again-distillation
