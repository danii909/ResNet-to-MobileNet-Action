# Knowledge Distillation (KD-only) 
#
# Baseline settings matching previous experiments (e.g. 4201, 4384) 
# but with higher temperature and alpha values.
#
# Temperature: 10.0 (softer targets)
# Alpha: 0.9 (90% weight to KD loss, 10% to CE loss)
# AT: Disabled (pure distillation)

seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 24
  crop_size: 112
  backend: hf
  use_eval_split: true
  eval_ratio: 0.2
  split_seed: 42

training:
  mode: distillation
  epochs: 75
  batch_size: 16
  num_workers: 4
  optimizer: adamw
  lr: 0.00005
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  checkpoint_dir: experiments/checkpoints

distillation:
  teacher_checkpoint: experiments/checkpoints/teacher_finetune_best.pth
  temperature: 10.0
  alpha: 0.9

logging:
  enabled: true
  project: kd-action-recognition
  run_name: kd-t10-a09-pure
