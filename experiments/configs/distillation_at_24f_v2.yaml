# Knowledge Distillation + Attention Transfer v2
#
# Extra Objective: Transfer intermediate feature maps (spatial attention maps)
# from the teacher's residual blocks to the student's inverted-residual stages.
#
# AT loss: L = α * T² * KL(student || teacher) + (1-α) * CE + β * Σ_i MSE(A_t_i, A_s_i)
#
# Feature pairs (teacher_block → student_stage):
#   block 3  →  stage 2  (mid-level spatial features)
#   block 4  →  stage 4  (abstract spatial features)
#   block 5  →  stage 6  (high-level semantic features)
#
# β=0.05: conservative weight; AT is a sum of 3 MSE terms each in [0,2], so
# total AT contribution ≤ 0.05 * 6 = 0.30, comparable to the CE component.
#
# Key improvements over attention_transfer.yaml:
#   - 75 epochs  (old config: 60)
#   - 24 frames  (old config: 16)
#   - max_temporal_stride: 2  (new)
#   - cosine_warmup scheduler (new)
#   - group-aware eval split  (old config: none)
#   - at_beta: 0.05  (old config: 0.1 — lowered for stability)

seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 24
  crop_size: 112
  backend: hf
  resize_short_side: 128
  use_random_resized_crop: false
  color_jitter_strength: 0.1
  random_erasing_prob: 0.05
  max_temporal_stride: 2
  use_eval_split: true
  eval_ratio: 0.2
  split_seed: 42

training:
  mode: distillation_at
  epochs: 75
  batch_size: 16
  num_workers: 4
  optimizer: adamw
  lr: 0.0005
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine_warmup
  warmup_epochs: 5
  warmup_start_factor: 0.1
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.05
  kd_warmup_epochs: 3
  checkpoint_dir: experiments/checkpoints

distillation:
  teacher_checkpoint: experiments/checkpoints/teacher_finetune_best.pth
  temperature: 8.0
  alpha: 0.7
  at_beta: 0.05                   # Conservative β: 0.1 in old config caused instability
  teacher_keys: [3, 4, 5]         # Teacher residual block indices
  student_keys: [2, 4, 6]         # Student inverted-residual stage indices

logging:
  enabled: true
  project: kd-action-recognition
  run_name: kd-at-t8-a07-b005-24f-v2
