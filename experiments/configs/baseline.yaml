# Baseline: MobileNet3D student trained from scratch on UCF-101
# Usage: python -m src.training.train --config experiments/configs/baseline.yaml

seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 16
  crop_size: 112
  backend: hf

training:
  mode: baseline
  epochs: 60
  batch_size: 24
  num_workers: 4
  optimizer: adamw
  lr: 0.0008
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.1
  checkpoint_dir: experiments/checkpoints

logging:
  enabled: true
  project: kd-action-recognition
  run_name: baseline-mobilenet3d-retuned
