# Knowledge Distillation: Teacher (slow_r50) → Student (MobileNet3D)
# Usage: python -m src.training.train --config experiments/configs/distillation.yaml

seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 16
  crop_size: 112
  backend: hf

training:
  mode: distillation
  epochs: 60
  batch_size: 24
  num_workers: 4
  optimizer: adamw
  lr: 0.0006
  momentum: 0.9
  weight_decay: 0.001
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  checkpoint_dir: experiments/checkpoints

distillation:
  teacher_checkpoint: experiments/checkpoints/teacher_finetune_best.pth
  temperature: 3.0
  alpha: 0.4

logging:
  enabled: true
  project: kd-action-recognition
  run_name: distillation-retuned-T3-a0.4
