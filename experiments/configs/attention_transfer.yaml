# Knowledge Distillation + Attention Transfer: Teacher → Student
# Usage: python -m src.training.train --config experiments/configs/attention_transfer.yaml

seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 16
  crop_size: 112
  backend: hf

training:
  mode: distillation_at
  epochs: 60
  batch_size: 24
  num_workers: 4
  optimizer: adamw
  lr: 0.0006
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.1
  kd_warmup_epochs: 5
  checkpoint_dir: experiments/checkpoints

distillation:
  teacher_checkpoint: experiments/checkpoints/teacher_finetune_best.pth
  temperature: 8.0
  alpha: 0.7
  at_beta: 0.1
  teacher_keys: [2, 3, 4]
  student_keys: [2, 4, 6]

logging:
  enabled: true
  project: kd-action-recognition
  run_name: distillation-at-retuned-T8-a0.7-b0.1-warmup5
