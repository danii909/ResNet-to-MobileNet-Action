seed: 42

model:
  type: student
  width_mult: 1.0

dataset:
  data_dir: data/ucf101
  num_classes: 101
  num_frames: 24
  crop_size: 112
  backend: hf
  use_eval_split: true
  eval_ratio: 0.2
  split_seed: 42
  resize_short_side: 128
  use_random_resized_crop: false
  color_jitter_strength: 0.1
  random_erasing_prob: 0.05
  max_temporal_stride: 1

training:
  mode: distillation_at
  epochs: 60
  batch_size: 16
  num_workers: 4
  optimizer: adamw
  lr: 0.0005
  momentum: 0.9
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  mixed_precision: true
  label_smoothing: 0.1
  kd_warmup_epochs: 5
  checkpoint_dir: experiments/checkpoints

distillation:
  teacher_type: teacher
  teacher_checkpoint: /home/brbdnl01e03e017o/dl26-projects/experiments/checkpoints/teacher_finetune_best.pth
  temperature: 8.0
  alpha: 0.7
  at_beta_spatial: 0.05
  at_beta_temporal: 0.05
  teacher_keys: [4]
  student_keys: [6]

logging:
  enabled: true
  project: kd-action-recognition
  run_name: exp3_at_latestage_semantico
